# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0 # Use the latest tag
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-toml
    -   id: check-added-large-files
-   repo: https://github.com/psf/black
    rev: 24.4.2 # Use a recent version compatible with your config
    hooks:
    -   id: black
        args: [--line-length=120] # Match pyproject.toml setting
-   repo: https://github.com/PyCQA/flake8
    rev: 7.1.0 # Use a recent version
    hooks:
    -   id: flake8
        additional_dependencies: [
            "flake8-bugbear==23.5.9",
            "flake8-docstrings",
            "flake8-pyproject",
        ]
        # Removed args to rely on pyproject.toml configuration
